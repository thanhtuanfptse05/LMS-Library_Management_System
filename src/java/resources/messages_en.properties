# --- Policies & Instructions ---
policies.guest_heading=Quick Instructions for Guests
policies.step1_title=Register for a Guest Pass
policies.step1_desc=Visit the main reception desk with a valid ID to obtain a temporary day pass for physical access.
policies.step2_title=Connect to Guest Wi-Fi
policies.step2_desc=Use the network 'UniLib-Guest' and follow the portal instructions to gain high-speed access.
policies.step3_title=Reference Only Access
policies.step3_desc=Guests can use all books within the premises but are not permitted to check out items for off-site use.
policies.heading=Library Policies
policies.p1=Quiet zones must be respected at all times.
policies.p2=Laptops and devices must be on silent mode.
policies.p3=Bottled water only; no food in the stack areas.
policies.p4=Maximum guest occupancy is 50 persons daily.
