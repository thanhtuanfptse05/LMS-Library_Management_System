  <line x1="375" y1="378" x2="215" y2="378" class="sub-line"/><text x="10" y="370" class="sub-text">Local Sign-in &amp; Logout</text>
  <line x1="450" y1="552" x2="290" y2="552" class="sub-line"/><text x="85" y="544" class="sub-text">Google OAuth 2.0 SSO</text>
  <line x1="525" y1="726" x2="365" y2="726" class="sub-line"/><text x="160" y="718" class="sub-text">Forgot &amp; Reset Password</text>

  <!-- Cat 2 -->
