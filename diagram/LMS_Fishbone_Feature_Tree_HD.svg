  <line x1="2570" y1="552" x2="2410" y2="552" class="sub-line"/><text x="2210" y="544" class="sub-text">Queue Position Track</text>
  <line x1="2645" y1="726" x2="2485" y2="726" class="sub-line"/><text x="2285" y="718" class="sub-text">Renewal Limit Policy</text>

