  <line x1="905" y1="378" x2="745" y2="378" class="sub-line"/><text x="550" y="370" class="sub-text">Student Code &amp; Major</text>
  <line x1="980" y1="552" x2="820" y2="552" class="sub-line"/><text x="630" y="544" class="sub-text">Lecturer Department</text>
  <line x1="1055" y1="726" x2="895" y2="726" class="sub-line"/><text x="705" y="718" class="sub-text">MemberProfile CRUD</text>

  <!-- Cat 3 -->
