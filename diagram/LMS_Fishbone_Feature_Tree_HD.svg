  <line x1="2115" y1="1074" x2="1955" y2="1074" class="sub-line"/><text x="1700" y="1100" class="sub-text">Check-out Barcode</text>
  <line x1="2040" y1="1248" x2="1880" y2="1248" class="sub-line"/><text x="1630" y="1274" class="sub-text">Check-in Barcode</text>
  <line x1="1965" y1="1422" x2="1805" y2="1422" class="sub-line"/><text x="1565" y="1448" class="sub-text">Borrow Limits Check</text>

  <!-- Cat 10 -->
  <rect x="2240" y="1595" width="360" height="85" class="cat-box"/>
