<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3200 1800" width="100%" height="100%">
  <style>
    .spine { stroke: #0f172a; stroke-width: 8; }
    .rib { stroke: #334155; stroke-width: 5; }
    .sub-line { stroke: #64748b; stroke-width: 2.5; }
    .head-ellipse { fill: #bbf7d0; stroke: #15803d; stroke-width: 5; }
    .cat-box { fill: #ffedd5; stroke: #c2410c; stroke-width: 4; rx: 12; ry: 12; }
    .head-text { font-family: 'Segoe UI', Arial, sans-serif; font-weight: bold; font-size: 42px; fill: #14532d; text-anchor: middle; }
    .cat-text { font-family: 'Segoe UI', Arial, sans-serif; font-weight: bold; font-size: 26px; fill: #020617; text-anchor: middle; }
    .sub-text { font-family: 'Segoe UI', Arial, sans-serif; font-weight: bold; font-size: 21px; fill: #0f172a; }
  </style>

  <rect width="3200" height="1800" fill="#ffffff"/>

  <!-- Main Spine -->
  <line x1="100" y1="900" x2="2750" y2="900" class="spine" />

  <!-- Fish Head -->
  <ellipse cx="2935" cy="900" rx="185" ry="140" class="head-ellipse" />
  <text x="2935" y="890" class="head-text">LMS System</text>
  <text x="2935" y="940" class="head-text">(BetterHR)</text>

  <!-- TOP CATEGORIES -->
  <!-- Cat 1 -->
  <rect x="120" y="120" width="360" height="85" class="cat-box"/>
  <text x="300" y="172" class="cat-text">Auth &amp; Access Control</text>
