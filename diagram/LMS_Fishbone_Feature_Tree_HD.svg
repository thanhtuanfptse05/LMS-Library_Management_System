  <line x1="1055" y1="1074" x2="895" y2="1074" class="sub-line"/><text x="705" y="1100" class="sub-text">Email Notice (OTP)</text>
  <line x1="980" y1="1248" x2="820" y2="1248" class="sub-line"/><text x="630" y="1274" class="sub-text">Gemini AI Assistant</text>
  <line x1="905" y1="1422" x2="745" y2="1422" class="sub-line"/><text x="555" y="1448" class="sub-text">System Bulletins</text>

