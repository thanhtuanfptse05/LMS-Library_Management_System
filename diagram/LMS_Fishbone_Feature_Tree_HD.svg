  <line x1="525" y1="1074" x2="365" y2="1074" class="sub-line"/><text x="190" y="1100" class="sub-text">User Lock / Unlock</text>
  <line x1="450" y1="1248" x2="290" y2="1248" class="sub-line"/><text x="110" y="1274" class="sub-text">Failed Login Limit</text>
  <line x1="375" y1="1422" x2="215" y2="1422" class="sub-line"/><text x="35" y="1448" class="sub-text">System Audit Logs</text>

