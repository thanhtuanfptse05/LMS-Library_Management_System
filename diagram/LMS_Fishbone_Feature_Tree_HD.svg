  <line x1="2645" y1="1074" x2="2485" y2="1074" class="sub-line"/><text x="2245" y="1100" class="sub-text">Inventory Audit Session</text>
  <line x1="2570" y1="1248" x2="2410" y2="1248" class="sub-line"/><text x="2180" y="1274" class="sub-text">Location Scan Audit</text>
  <line x1="2495" y1="1422" x2="2335" y2="1422" class="sub-line"/><text x="2115" y="1448" class="sub-text">Config Key Management</text>

</svg>