  <line x1="1435" y1="378" x2="1275" y2="378" class="sub-line"/><text x="1070" y="370" class="sub-text">Book Metadata &amp; ISBN</text>
  <line x1="1510" y1="552" x2="1350" y2="552" class="sub-line"/><text x="1150" y="544" class="sub-text">Category &amp; Tag Map</text>
  <line x1="1585" y1="726" x2="1425" y2="726" class="sub-line"/><text x="1230" y="718" class="sub-text">BookCopy Barcodes</text>

