name: LMS Constitution Check CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  constitution-check:
    name: Constitution & Anti-Framework Checks
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Run Anti-Framework & Security Verification
      run: |
        echo "=========================================================="
        echo "          STARTING LMS CONSTITUTION CHECKS                "
        echo "=========================================================="
        VIOLATIONS=0

        # Rule 1: Cấm Spring Framework
        echo "Checking for Spring Framework usage..."
        if grep -rni "org.springframework" src/java/ ; then
          echo "❌ ERROR: Found Spring Framework imports! (Violation of ARCH-01)"
          VIOLATIONS=$((VIOLATIONS+1))
        fi

        # Rule 2: Cấm Hibernate
        echo "Checking for Hibernate usage..."
        if grep -rni "org.hibernate" src/java/ ; then
          echo "❌ ERROR: Found Hibernate imports! (Violation of ARCH-01)"
          VIOLATIONS=$((VIOLATIONS+1))
        fi

        # Rule 3: Cấm JPA / Persistence API
        echo "Checking for JPA / javax.persistence usage..."
        if grep -rni "javax.persistence" src/java/ || grep -rni "jakarta.persistence" src/java/ ; then
          echo "❌ ERROR: Found JPA/Persistence imports! (Violation of ARCH-01)"
          VIOLATIONS=$((VIOLATIONS+1))
        fi

        # Rule 4: Chống SQL Injection - Cấm String Concatenation trong SQL Query
        echo "Checking for potential SQL Injection (String Concatenation in Statement)..."
        # Tìm các dòng lệnh sql hoặc query được cộng chuỗi với biến Java (ví dụ: + userId hoặc + select)
        if grep -rnE "stmt\.execute.*(\+|concat)" src/java/ || grep -rnE "Connection.*\.createStatement" src/java/ ; then
          echo "❌ WARNING: Found Statement or potential String concatenation in queries! (Violation of SEC-03)"
          echo "Always use PreparedStatement instead."
          VIOLATIONS=$((VIOLATIONS+1))
        fi

        # Rule 5: Bảo mật thông tin - Quét các chuỗi Plaintext Secrets
        echo "Checking for hardcoded plaintext password/keys..."
        if grep -rni "vnp_HashSecret = \"" src/java/ || grep -rni "SendGrid_API_Key = \"" src/java/ ; then
          echo "❌ ERROR: Hardcoded sensitive API secrets detected! (Violation of SEC-01)"
          VIOLATIONS=$((VIOLATIONS+1))
        fi

        # Kết luận
        if [ $VIOLATIONS -ne 0 ]; then
          echo "=========================================================="
          echo "❌ CONSTITUTION CHECK FAILED! Violations count: $VIOLATIONS"
          echo "=========================================================="
          exit 1
        else
          echo "=========================================================="
          echo "✅ CONSTITUTION CHECK PASSED! No framework violations found."
          echo "=========================================================="
        fi
